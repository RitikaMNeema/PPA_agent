name: ci
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy pytest anthropic
      - run: pytest -q tests
  docker:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ppa-agent -f docker/Dockerfile .
      - name: flow smoke test in container (lint + RTL sim + synth + STA)
        run: docker run --rm -v "$PWD:/work" ppa-agent python3 flow/run_flow.py --tag ci_smoke --skip-power
